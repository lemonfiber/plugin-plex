# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on: [pull_request]
permissions:
  contents: read

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. A reusable workflow's permissions block is a request,
  # and a caller granting less than it asks for fails the whole run before any
  # job starts — every required context silent, and nothing to report against.
  # The workflow-level `contents: read` is the default for a job that declares
  # nothing, and a job-level block replaces that default outright, so
  # `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@9d1b96f05269fcf3d8b7a0b4e05d9b83082164ff # v1.0.2
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@9d1b96f05269fcf3d8b7a0b4e05d9b83082164ff # v1.0.2
  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@9d1b96f05269fcf3d8b7a0b4e05d9b83082164ff # v1.0.2
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@9d1b96f05269fcf3d8b7a0b4e05d9b83082164ff # v1.0.2
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@9d1b96f05269fcf3d8b7a0b4e05d9b83082164ff # v1.0.2
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@9d1b96f05269fcf3d8b7a0b4e05d9b83082164ff # v1.0.2
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@9d1b96f05269fcf3d8b7a0b4e05d9b83082164ff # v1.0.2
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@9d1b96f05269fcf3d8b7a0b4e05d9b83082164ff # v1.0.2
  # Two of the checks above surprise somebody meeting this organisation for the
  # first time, which is most people who open a pull request here: `spec-check`
  # *closes* a pull request rather than only failing it, and `dco` *skips* merge
  # and bot commits, so it can pass with an unsigned commit in the range.
  #
  # This posts the explanation on the pull request — only where the contributor
  # has not already satisfied the check, and it deletes the comment once they do
  # (GOV-R33). The wording lives in lemonfiber/spec and is not copied here.
  #
  # `pull-requests: write` is what lets it post and delete the comment. A caller
  # granting less than a reusable workflow asks for fails the whole run before
  # any job starts, so the block is not optional.
  explain:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/explain.yml@ef0414f262099080c9a6b5c8d5f528b6f74e0403 # v1.0.7
