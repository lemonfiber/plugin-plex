[package]
name = "plex-adapter"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-plex"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's owner.claim, media.serve and identity.source contracts in front of Plex"
publish = false

[[bin]]
name = "plex-adapter"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "0d8245e1af6579fbc5b2e186c21597475b18dc0d" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "0d8245e1af6579fbc5b2e186c21597475b18dc0d" }
lemonfiber-pinned = { git = "https://github.com/lemonfiber/lemonfiber", rev = "0d8245e1af6579fbc5b2e186c21597475b18dc0d" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "0d8245e1af6579fbc5b2e186c21597475b18dc0d" }
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "0d8245e1af6579fbc5b2e186c21597475b18dc0d" }
lemonfiber-pinned = { git = "https://github.com/lemonfiber/lemonfiber", rev = "0d8245e1af6579fbc5b2e186c21597475b18dc0d", features = ["test-support"] }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "0d8245e1af6579fbc5b2e186c21597475b18dc0d" }
regex = "1"
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

